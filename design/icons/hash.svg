<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Hash: a heading mark and a live text cursor -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d6af5"/><stop offset="1" stop-color="#3b1a8f"/></linearGradient>
    <radialGradient id="hl" cx=".28" cy=".18" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)" filter="url(#sh)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#hl)"/>
  <g stroke="#fff" stroke-width="78" stroke-linecap="round">
    <line x1="430" y1="300" x2="382" y2="724"/><line x1="580" y1="300" x2="532" y2="724"/>
    <line x1="290" y1="430" x2="670" y2="430"/><line x1="272" y1="594" x2="652" y2="594"/>
  </g>
  <rect x="736" y="300" width="56" height="424" rx="28" fill="#fbbf24"/>
</svg>
